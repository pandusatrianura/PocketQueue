syntax = "proto3";

package ecommerce;

option go_package = "github.com/pandusatrianura/pocketqueue/test/fixtures";

enum OrderStatus {
  PENDING = 0;
  PROCESSING = 1;
  COMPLETED = 2;
  CANCELLED = 3;
}

message OrderItem {
  string item_id = 1;
  int32 quantity = 2;
  double price = 3;
}

message OrderEvent {
  string order_id = 1;
  string customer_id = 2;
  double total_amount = 3;
  OrderStatus status = 4;
  repeated OrderItem items = 5;
  int64 timestamp_ms = 6;
}
